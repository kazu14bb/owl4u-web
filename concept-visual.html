<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL 4 U — Concept Visual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@200;300&family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1c1a15; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2.5rem; }
    .vis { width: 100%; max-width: 1600px; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="vis">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

  <!-- ─── BACKGROUND ─── -->
  <rect width="1600" height="900" fill="#f5f1ea"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="g" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(26,23,16,0.025)" stroke-width="0.4"/>
    </pattern>
    <!-- Center radial glow -->
    <radialGradient id="cg" cx="50%" cy="50%" r="30%">
      <stop offset="0%"   stop-color="rgba(168,136,96,0.07)"/>
      <stop offset="100%" stop-color="rgba(245,241,234,0)"/>
    </radialGradient>
    <!-- Leaf green accent -->
    <radialGradient id="lg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(130,148,122,0.12)"/>
      <stop offset="100%" stop-color="rgba(245,241,234,0)"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>

  <!-- Outer border (page feel) -->
  <rect x="28" y="22" width="1544" height="856" fill="none" stroke="rgba(26,23,16,0.055)" stroke-width="0.5"/>

  <!-- Center warm glow -->
  <ellipse cx="800" cy="450" rx="400" ry="290" fill="url(#cg)"/>

  <!-- Nature area subtle green hint -->
  <ellipse cx="1010" cy="68" rx="90" ry="60" fill="url(#lg)"/>


  <!-- ─── CONNECTING LINES (dashed, very subtle) ─── -->
  <g stroke="#c4b8ac" stroke-width="0.6" fill="none" stroke-dasharray="1.4 7.5" stroke-linecap="round">
    <!-- Center (800,450) → Morning (338,112) -->
    <path d="M 800,450 Q 558,298 338,112"/>
    <!-- → Home (180,450) -->
    <path d="M 800,450 Q 490,448 180,450"/>
    <!-- → Work (330,736) -->
    <path d="M 800,450 Q 578,596 330,736"/>
    <!-- → Reading (648,840) -->
    <path d="M 800,450 Q 724,648 648,840"/>
    <!-- → Music (1014,840) -->
    <path d="M 800,450 Q 908,648 1014,840"/>
    <!-- → Creation (1366,668) -->
    <path d="M 800,450 Q 1094,578 1366,668"/>
    <!-- → Dialogue (1382,218) -->
    <path d="M 800,450 Q 1096,364 1382,218"/>
    <!-- → Nature (1010,68) -->
    <path d="M 800,450 Q 904,264 1010,68"/>
  </g>


  <!-- ─── NODE DOTS ─── -->
  <g fill="rgba(168,136,96,0.42)">
    <circle cx="338"  cy="112" r="2.4"/>
    <circle cx="180"  cy="450" r="2.4"/>
    <circle cx="330"  cy="736" r="2.4"/>
    <circle cx="648"  cy="840" r="2.4"/>
    <circle cx="1014" cy="840" r="2.4"/>
    <circle cx="1366" cy="668" r="2.4"/>
    <circle cx="1382" cy="218" r="2.4"/>
    <circle cx="1010" cy="68"  r="2.4"/>
  </g>


  <!-- ─── CENTER HUB ─── -->
  <circle cx="800" cy="450" r="94"  fill="none" stroke="rgba(168,136,96,0.07)" stroke-width="0.7"/>
  <circle cx="800" cy="450" r="68"  fill="none" stroke="rgba(168,136,96,0.12)" stroke-width="0.7"/>
  <circle cx="800" cy="450" r="44"  fill="rgba(245,241,234,0.92)" stroke="rgba(122,98,72,0.28)" stroke-width="0.85"/>
  <circle cx="800" cy="450" r="2.8" fill="rgba(122,98,72,0.32)"/>

  <text x="800" y="437" text-anchor="middle"
    font-family="'Cormorant Garamond', serif" font-size="14" font-weight="300"
    fill="#1a1710" letter-spacing="5.5">OWL 4 U</text>
  <text x="800" y="452" text-anchor="middle"
    font-family="'Cormorant Garamond', serif" font-size="8.5" font-weight="300"
    fill="#6a6055" letter-spacing="2.5" font-style="italic">cafe &amp; bar</text>
  <text x="800" y="465" text-anchor="middle"
    font-family="'Cormorant Garamond', serif" font-size="6.5" font-weight="300"
    fill="rgba(106,96,85,0.5)" letter-spacing="1.8">MORISHITA, TOKYO</text>


  <!-- ─── TAGLINE ─── -->
  <text x="800" y="570" text-anchor="middle"
    font-family="'Noto Serif JP', serif" font-size="13" font-weight="200"
    fill="#6a6055" letter-spacing="1.8">それぞれの場所を持ちながら、ここで少しだけ交わる。</text>
  <text x="800" y="590" text-anchor="middle"
    font-family="'Cormorant Garamond', serif" font-size="11.5" font-weight="300"
    fill="rgba(106,96,85,0.4)" letter-spacing="1.5" font-style="italic">Each carries their own world. Here, they briefly meet.</text>


  <!-- ─── ICONS ─── -->
  <!-- stroke: #9a9488 (warm muted gray), stroke-width: 0.88, fill: very faint -->

  <!-- 1. MORNING (朝の静かな時間) at (338, 112) -->
  <!-- Sunrise: horizon + half sun + rays -->
  <g transform="translate(338,112)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <line x1="-21" y1="9" x2="21" y2="9"/>
    <path d="M -12,9 A 12,12 0 0,1 12,9" fill="rgba(154,148,136,0.07)"/>
    <line x1="0"   y1="-5" x2="0"  y2="-10"/>
    <line x1="9"   y1="-2" x2="13" y2="-6"/>
    <line x1="-9"  y1="-2" x2="-13" y2="-6"/>
    <line x1="15"  y1="4"  x2="19" y2="3.5"/>
    <line x1="-15" y1="4"  x2="-19" y2="3.5"/>
  </g>
  <text x="338" y="137" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">MORNING</text>

  <!-- 2. HOME (家) at (180, 450) -->
  <g transform="translate(180,450)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <polyline points="-16,4 0,-14 16,4"/>
    <rect x="-12" y="4" width="24" height="18" rx="0.5" fill="rgba(154,148,136,0.06)"/>
    <rect x="-4"  y="11" width="8" height="11" fill="rgba(154,148,136,0.05)"/>
    <rect x="4"   y="-11" width="5" height="7" fill="none"/>
  </g>
  <text x="180" y="480" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">HOME</text>

  <!-- 3. WORK (仕事・作業) at (330, 736) — Notebook -->
  <g transform="translate(330,736)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <rect x="-13" y="-19" width="26" height="32" rx="1.5" fill="rgba(154,148,136,0.06)"/>
    <rect x="-13" y="-19" width="6"  height="32" fill="rgba(154,148,136,0.09)"/>
    <line x1="-4" y1="-11" x2="10" y2="-11"/>
    <line x1="-4" y1="-6"  x2="10" y2="-6"/>
    <line x1="-4" y1="-1"  x2="8"  y2="-1"/>
    <line x1="-4" y1="4"   x2="10" y2="4"/>
  </g>
  <text x="330" y="764" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">WORK</text>

  <!-- 4. READING (読書) at (648, 840) — Open book -->
  <g transform="translate(648,840)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <path d="M 0,-17 L -21,-11 L -21,14 L 0,8 Z" fill="rgba(154,148,136,0.06)"/>
    <path d="M 0,-17 L  21,-11 L  21,14 L 0,8 Z" fill="rgba(154,148,136,0.05)"/>
    <line x1="0" y1="-17" x2="0" y2="8"/>
    <line x1="-16" y1="-5" x2="-4" y2="-7" stroke-opacity="0.5"/>
    <line x1="-16" y1="-1" x2="-4" y2="-3" stroke-opacity="0.5"/>
    <line x1="-16" y1=" 3" x2="-4" y2=" 1" stroke-opacity="0.5"/>
    <line x1=" 4"  y1="-7" x2="16" y2="-5" stroke-opacity="0.5"/>
    <line x1=" 4"  y1="-3" x2="16" y2="-1" stroke-opacity="0.5"/>
  </g>
  <text x="648" y="868" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">READING</text>

  <!-- 5. MUSIC (音楽) at (1014, 840) — Two eighth notes -->
  <g transform="translate(1014,840)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <line x1="-7"  y1="-16" x2="8" y2="-19"/>
    <line x1="-7"  y1="-16" x2="-7"  y2="4"/>
    <line x1=" 8"  y1="-19" x2=" 8"  y2="1"/>
    <ellipse cx="-9.5" cy="4"  rx="5.5" ry="3.5" transform="rotate(-14,-9.5,4)"  fill="rgba(154,148,136,0.18)"/>
    <ellipse cx=" 5.5" cy="1"  rx="5.5" ry="3.5" transform="rotate(-14,5.5,1)"   fill="rgba(154,148,136,0.18)"/>
  </g>
  <text x="1014" y="868" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">MUSIC</text>

  <!-- 6. CREATION (創作) at (1366, 668) — Paintbrush -->
  <g transform="translate(1366,668) rotate(38)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <rect x="-3"   y="-22" width="6" height="24" rx="1.2" fill="rgba(154,148,136,0.06)"/>
    <rect x="-3.5" y="-1"  width="7" height="5"         fill="rgba(154,148,136,0.13)"/>
    <path d="M -3,4 Q -5,11 0,20 Q 5,11 3,4 Z"          fill="rgba(154,148,136,0.1)"/>
    <line x1="0" y1="16" x2="0" y2="20"/>
  </g>
  <text x="1366" y="702" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">CREATION</text>

  <!-- 7. DIALOGUE (対話) at (1382, 218) — Two circles -->
  <g transform="translate(1382,218)" stroke="#9a9488" stroke-width="0.88" fill="none" stroke-linecap="round">
    <circle cx="-8" cy="-5" r="12" fill="rgba(154,148,136,0.06)"/>
    <circle cx=" 7" cy=" 5" r="10" fill="rgba(154,148,136,0.08)"/>
  </g>
  <text x="1382" y="244" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">DIALOGUE</text>

  <!-- 8. NATURE (自然) at (1010, 68) — Leaf with veins -->
  <g transform="translate(1010,68)" stroke="#8a9882" stroke-width="0.88" fill="none" stroke-linecap="round">
    <path d="M 0,17 C -17,10 -19,-9 0,-19 C 19,-9 17,10 0,17 Z" fill="rgba(138,152,130,0.1)"/>
    <line x1="0" y1="-19" x2="0" y2="17"/>
    <line x1="0" y1="-11" x2="-8"  y2="-5"/>
    <line x1="0" y1="-5"  x2="-10" y2=" 2"/>
    <line x1="0" y1=" 1"  x2="-7"  y2=" 7"/>
    <line x1="0" y1="-11" x2=" 8"  y2="-5"/>
    <line x1="0" y1="-5"  x2=" 10" y2=" 2"/>
    <line x1="0" y1=" 1"  x2=" 7"  y2=" 7"/>
  </g>
  <text x="1010" y="97" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.62)" letter-spacing="2">NATURE</text>


  <!-- ─── SCATTERED MICRO DOTS (paper texture / life) ─── -->
  <g fill="rgba(168,136,96,0.14)">
    <circle cx="468"  cy="248" r="1.2"/>
    <circle cx="560"  cy="692" r="1"/>
    <circle cx="1130" cy="314" r="1.2"/>
    <circle cx="1060" cy="726" r="1"/>
    <circle cx="618"  cy="162" r="1"/>
    <circle cx="984"  cy="544" r="1.2"/>
    <circle cx="414"  cy="580" r="1"/>
    <circle cx="1202" cy="504" r="1"/>
    <circle cx="742"  cy="762" r="1.2"/>
    <circle cx="862"  cy="152" r="1"/>
    <circle cx="300"  cy="420" r="0.9"/>
    <circle cx="1288" cy="394" r="0.9"/>
  </g>

  <!-- ─── FINE CROSS MARKS (map / diagram feel) ─── -->
  <g stroke="rgba(168,136,96,0.18)" stroke-width="0.5" stroke-linecap="round">
    <line x1="497" y1="257" x2="503" y2="263"/> <line x1="503" y1="257" x2="497" y2="263"/>
    <line x1="1104" y1="348" x2="1110" y2="354"/> <line x1="1110" y1="348" x2="1104" y2="354"/>
    <line x1="660" y1="646" x2="666" y2="652"/>  <line x1="666" y1="646" x2="660" y2="652"/>
    <line x1="948" y1="682" x2="954" y2="688"/>  <line x1="954" y1="682" x2="948" y2="688"/>
    <line x1="726" y1="210" x2="732" y2="216"/>  <line x1="732" y1="210" x2="726" y2="216"/>
  </g>

  <!-- ─── FINE PRINT ─── -->
  <text x="800" y="876" text-anchor="middle"
    font-family="'Cormorant Garamond', serif" font-size="7.5" font-weight="300"
    fill="rgba(106,96,85,0.22)" letter-spacing="3.5">ALL FOR YOU — OWL 4 U — MORISHITA, TOKYO</text>

</svg>
</div>
</body>
</html>
